<main class="page">
  <header class="header">
    <h1>{{ napCount() }} Nap Day</h1>

    <label class="rise-input">
      <span>Morning rise</span>
      <input type="time" [ngModel]="riseTime()" (ngModelChange)="onRiseTimeChange($event)" />
    </label>

    <a
      class="settings-link"
      routerLink="/settings"
      aria-label="Schedule settings"
      title="Schedule settings"
    >
      <ng-icon [svg]="icons.settings" />
    </a>
  </header>

  <div class="now-banner">
    <span class="now-label">Currently</span>
    <span class="now-value">{{ currentSegment().displayLabel }}</span>
  </div>

  <ol class="timeline">
    @for (segment of segments(); track segment.id; let i = $index) {
      <li>
        @if (segment.kind === 'awake') {
          <button
            type="button"
            class="awake-caption"
            [class.active]="i === activeIndex()"
            (click)="jumpTo(i)"
          >
            {{ segment.displayLabel }} ({{ segment.startLabel }} - {{ segment.endLabel }})
          </button>
        } @else {
          <button
            type="button"
            class="card"
            [class.active]="i === activeIndex()"
            [class.card--nap]="segment.kind === 'nap'"
            (click)="jumpTo(i)"
          >
            <div class="card-text">
              <div class="card-title-row">
                <span class="card-title">{{ segment.label }}</span>
                @if (segment.kind === 'nap') {
                  <span class="card-badge">{{ segment.durationLabel }}</span>
                  @if (segment.actualDurationLabel) {
                    <span class="card-badge card-badge--actual">
                      {{ segment.actualDurationLabel }} actual
                    </span>
                  }
                }
              </div>
              <span class="card-time">
                @if (segment.kind === 'nap') {
                  {{ segment.startLabel }} - {{ segment.endLabel }}
                } @else {
                  {{ segment.startLabel }}
                }
              </span>
            </div>
            <div class="card-icon"><ng-icon [svg]="segment.icon" /></div>
          </button>

          @if (segment.kind === 'nap') {
            <div class="nap-actuals">
              <label>
                <span>Actual start</span>
                <input
                  type="time"
                  [ngModel]="segment.actualStartTime ?? ''"
                  (ngModelChange)="onActualNapStartChange(segment.id, $event)"
                />
              </label>
              <label>
                <span>Actual end</span>
                <input
                  type="time"
                  [ngModel]="segment.actualEndTime ?? ''"
                  (ngModelChange)="onActualNapEndChange(segment.id, $event)"
                />
              </label>
              @if (segment.isActual) {
                <button
                  type="button"
                  class="nap-actuals-clear"
                  (click)="clearActualNapTimes(segment.id)"
                >
                  Clear
                </button>
              }
            </div>
          }
        }
      </li>
    }
  </ol>

  <footer class="controls">
    <button type="button" class="btn btn-secondary" (click)="reset()" [disabled]="isFirst()">
      Reset
    </button>
    <button type="button" class="btn btn-secondary" (click)="previous()" [disabled]="isFirst()">
      Prev
    </button>
    <button type="button" class="btn btn-primary" (click)="next()" [disabled]="isLast()">
      @if (nextSegment(); as next) {
        Next: {{ next.displayLabel }}
      } @else {
        Next
      }
    </button>
  </footer>
</main>
